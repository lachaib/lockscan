version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '12:00'
      timezone: Europe/Paris
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '12:00'
      timezone: Europe/Paris
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
